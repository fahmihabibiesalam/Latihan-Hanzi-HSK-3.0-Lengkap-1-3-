<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>HSK 1–3 Vocabulary Trainer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{ --brand:#c8102e; --brand-dark:#a00d25; }
  body{
    background:#f4f5f7;

    padding-bottom:3rem;
  }
  .navbar-brand{ font-weight:700; letter-spacing:.5px; }
  .nav-pills .nav-link{ color:#495057; font-weight:600; font-size:.92rem; }
  .nav-pills .nav-link.active{ background:var(--brand); color:#fff; }
  .level-btn.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .level-btn{ font-size:.8rem; font-weight:600; padding:.25rem .7rem; }
  .search-wrap{ position:relative; }
  .search-wrap .form-control{ padding-left:2.4rem; border-radius:.7rem; }
  .search-wrap .icon{ position:absolute; left:.85rem; top:50%; transform:translateY(-50%); opacity:.5; }
  .v-item{
    background:#fff; border:1px solid #e6e8eb; border-radius:.8rem;
    padding:.7rem .85rem; transition:.15s;
  }
  .v-item:hover{ border-color:#c9ced4; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .hz{ font-size:1.45rem; font-weight:700; letter-spacing:.06em; color:#1b1f24; }
  .hz-sm{ font-size:1.25rem; font-weight:700; letter-spacing:.05em; }
  .py{ color:var(--brand); font-weight:600; font-size:.95rem; }
  .def{ color:#4b5157; font-size:.86rem; line-height:1.35; }
  .badge-lv{ font-size:.62rem; font-weight:700; padding:.22em .5em; border-radius:.4rem; }
  .lv1{ background:#e7f1ff; color:#0b5ed7; }
  .lv2{ background:#e6f7ee; color:#0f7a44; }
  .lv3{ background:#fff1e0; color:#a85b00; }
  .speak-btn{ border:none; background:#f1f3f5; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:.95rem; flex:0 0 auto; }
  .speak-btn:active{ transform:scale(.92); }
  /* Flashcard */
  .flashcard{
    background:#fff; border-radius:1.2rem; border:1px solid #e6e8eb;
    min-height:270px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:1.5rem; cursor:pointer; user-select:none;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
  }
  .flashcard .big-hz{ font-size:4.2rem; font-weight:700; letter-spacing:.1em; line-height:1.1; }
  .flashcard .big-py{ font-size:1.5rem; color:var(--brand); font-weight:600; margin-top:.6rem; }
  .flashcard .big-def{ font-size:1.05rem; color:#444; margin-top:.8rem; }
  .hint{ color:#adb5bd; font-size:.8rem; }
  /* Quiz */
  .quiz-opt{ text-align:left; border-radius:.8rem; padding:.85rem 1rem; font-size:.95rem; }
  .quiz-opt.correct{ background:#d1f0dd; border-color:#48a868; }
  .quiz-opt.wrong{ background:#fbdcdc; border-color:#d9534f; }
  .stat-pill{ background:#fff; border:1px solid #e6e8eb; border-radius:2rem; padding:.3rem .9rem; font-size:.85rem; font-weight:600; }
  .sticky-top-bar{ position:sticky; top:0; z-index:20; background:#f4f5f7; padding-top:.6rem; padding-bottom:.6rem; }
  footer{ font-size:.75rem; color:#98a0a8; }
</style>
</head>
<body>

<nav class="navbar navbar-dark" style="background:var(--brand)">
  <div class="container-fluid">
    <span class="navbar-brand mb-0">汉语 HSK 1–3 Trainer</span>
    <span class="text-white-50 small" id="totalBadge"></span>
  </div>
</nav>

<div class="container">

  <!-- Tabs -->

    <li class="nav-item"><button class="nav-link active" data-tab="list">📚 Daftar</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="card">🃏 Kartu</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="quiz">✍️ Kuis</button></li>

    <span class="ms-auto stat-pill" id="countPill">0 kata</span>
  </div>

  <!-- ================= PANEL: LIST ================= -->
  <section id="panel-list">
    <div class="search-wrap mb-3">
      <span class="icon">🔍</span>
      <input type="search" id="searchInput" class="form-control form-control-lg"

    </div>
    <div class="d-flex flex-wrap gap-2 mb-3 small text-muted">
      <span>Contoh:</span>
      <button class="btn btn-sm btn-light border py-0 px-2 example">爱</button>
      <button class="btn btn-sm btn-light border py-0 px-2 example">xihuan</button>
      <button class="btn btn-sm btn-light border py-0 px-2 example">xǐ huan</button>
      <button class="btn btn-sm btn-light border py-0 px-2 example">to eat</button>
      <button class="btn btn-sm btn-light border py-0 px-2 example">beautiful</button>
    </div>
    <div id="listResult" class="row g-2"></div>
    <div id="listEmpty" class="text-center text-muted py-5 d-none">
      <div style="font-size:2.5rem">🔎</div>
      <p class="mb-0">Tidak ada hasil yang cocok.</p>
    </div>
  </section>

  <!-- ================= PANEL: FLASHCARD ================= -->
  <section id="panel-card" class="d-none">
    <div class="flashcard mb-3" id="flashcard">
      <div class="big-hz" id="fcHanzi">—</div>
      <div class="big-py d-none" id="fcPinyin"></div>
      <div class="big-def d-none" id="fcDef"></div>
      <div class="hint mt-3" id="fcHint">Ketuk kartu untuk melihat pinyin &amp; arti</div>
    </div>
    <div class="d-flex gap-2 mb-2">
      <button class="btn btn-outline-secondary flex-fill" id="fcPrev">◀ Sebelum</button>
      <button class="btn btn-outline-secondary flex-fill" id="fcFlip">🔄 Balik</button>
      <button class="btn btn-outline-secondary flex-fill" id="fcNext">Sesudah ▶</button>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary flex-fill" id="fcSpeak">🔊 Ucapkan</button>
      <button class="btn text-white flex-fill" style="background:var(--brand)" id="fcShuffle">🔀 Acak</button>
    </div>
    <p class="text-center text-muted small mt-3 mb-0" id="fcCounter"></p>
  </section>

  <!-- ================= PANEL: QUIZ ================= -->
  <section id="panel-quiz" class="d-none">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <div class="btn-group btn-group-sm" role="group">
        <button class="btn btn-outline-secondary active" id="modeH2M">汉字 → Arti</button>
        <button class="btn btn-outline-secondary" id="modeM2H">Arti → 汉字</button>
      </div>
      <span class="stat-pill ms-auto" id="scorePill">✅ 0 / 0</span>
      <button class="btn btn-sm btn-outline-secondary" id="quizReset">↺ Reset</button>
    </div>

    <div class="card border-0 shadow-sm mb-3" style="border-radius:1rem">
      <div class="card-body text-center py-4">
        <div id="quizQuestion" class="big-hz" style="font-size:3rem;font-weight:700;letter-spacing:.08em"></div>
        <div id="quizSub" class="py fw-semibold mt-1" style="font-size:1.1rem"></div>
      </div>
    </div>

    <div id="quizOptions" class="d-grid gap-2"></div>

    <div class="text-center mt-3">
      <button class="btn text-white px-4 d-none" style="background:var(--brand)" id="quizNext">Soal Berikutnya ▶</button>
    </div>
  </section>

  <footer class="text-center mt-5">
    <p class="mb-1">Sumber kosakata: Foreign Language Teaching and Research Press | Beijing 2025</p>
    <p class="mb-0">Masukan dan saran dapat disampaikan ke fahmihabibie@csu.edu.cn</p>
  </footer>
</div>

  'ō':'o','ó':'o','ǒ':'o','ò':'o',

  'ǖ':'u','ǘ':'u','ǚ':'u','ǜ':'u','ü':'u',
  'ń':'n','ň':'n','ǹ':'n','ê':'e'
};

function stripTones(str){
  let out = '';
  for (const ch of String(str).toLowerCase()){
    out += (TONE_MAP[ch] || ch);
  }
  return out.replace(/v/g,'u').replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
}

const VOCAB = DATA_TEXT.trim().split('\n').map(line => {
  const p = line.split('|');
  return {
    hanzi: p[0],
    pinyin: p[1],
    pos: p[2],
    def: p[3],
    level: parseInt(p[4], 10),
    py: stripTones(p[1])
  };
});

function speak(text){
  if (!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   3. STATE
   ============================================================ */
const state = {
  level: 0,
  tab: 'list',
  cardPool: [],
  cardIndex: 0,
  cardFlipped: false,
  quizPool: [],
  quizCurrent: null,
  quizMode: 'h2m',
  quizScore: 0,
  quizTotal: 0,
  quizLocked: false
};

function filtered(level){
  return VOCAB.filter(v => level === 0 || v.level === level);
}

/* ============================================================
   4. TAB NAVIGATION
   ============================================================ */
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  ['list','card','quiz'].forEach(t => {
    document.getElementById('panel-' + t).classList.toggle('d-none', t !== tab);
  });
  if (tab === 'card') buildCardPool();
  if (tab === 'quiz') newQuestion();
}

/* ============================================================
   5. LEVEL FILTER
   ============================================================ */
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.level = parseInt(btn.dataset.level, 10);
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
    updateCount();
    buildCardPool();
    newQuestion();
  });
});

function updateCount(){
  const n = filtered(state.level).length;
  document.getElementById('countPill').textContent = n + ' kata';
}

/* ============================================================
   6. SEARCH & LIST
   ============================================================ */
const searchInput = document.getElementById('searchInput');

searchInput.addEventListener('input', () => renderList());

document.querySelectorAll('.example').forEach(b => {
  b.addEventListener('click', () => {
    searchInput.value = b.textContent;
    renderList();
  });
});

function matches(v, q){
  if (!q) return true;
  const qLower = q.toLowerCase();
  const qPinyin = stripTones(q);

  if (v.hanzi.includes(q)) return true;
  if (v.def.toLowerCase().includes(qLower)) return true;
  if (qPinyin && v.py.includes(qPinyin)) return true;
  return false;
}

function renderList(){
  const q = searchInput.value.trim();
  const level = state.level;
  const pool = filtered(level);
  const results = q ? pool.filter(v => matches(v, q)) : pool;

  const container = document.getElementById('listResult');
  const empty = document.getElementById('listEmpty');

  if (results.length === 0){
    container.innerHTML = '';
    empty.classList.remove('d-none');
    return;
  }
  empty.classList.add('d-none');

  const MAX = 400;
  const shown = results.slice(0, MAX);

  container.innerHTML = shown.map((v, i) => `
    <div class="col-12 col-md-6 col-lg-4">
      <div class="v-item h-100 d-flex gap-2">
        <div class="flex-grow-1 min-w-0">
          <div class="d-flex align-items-baseline flex-wrap gap-2">
            <span class="hz-sm">${v.hanzi}</span>
            <span class="py">${v.pinyin}</span>
            <span class="badge-lv lv${v.level}">HSK${v.level}</span>
          </div>
          <div class="def mt-1"><em class="text-secondary">${v.pos}</em> ${v.def}</div>
        </div>
        <button class="speak-btn" data-say="${v.hanzi}" title="Ucapkan">🔊</button>
      </div>
    </div>
  `).join('') + (results.length > MAX
      ? `<div class="col-12"><p class="text-muted small text-center mt-2">Menampilkan ${MAX} dari ${results.length} hasil. Persempit pencarian Anda.</p></div>`
      : '');

  container.querySelectorAll('[data-say]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      speak(b.dataset.say);
    });
  });
}

/* ============================================================
   7. FLASHCARD
   ============================================================ */
const fcEl = document.getElementById('flashcard');
const fcHanzi = document.getElementById('fcHanzi');
const fcPinyin = document.getElementById('fcPinyin');
const fcDef = document.getElementById('fcDef');
const fcHint = document.getElementById('fcHint');
const fcCounter = document.getElementById('fcCounter');

function buildCardPool(){
  state.cardPool = shuffle(filtered(state.level).slice());
  state.cardIndex = 0;
  state.cardFlipped = false;
  renderCard();
}

function renderCard(){
  const pool = state.cardPool;
  if (pool.length === 0){
    fcHanzi.textContent = '—';
    fcPinyin.classList.add('d-none');
    fcDef.classList.add('d-none');
    fcCounter.textContent = '';
    return;
  }
  const v = pool[state.cardIndex];
  fcHanzi.textContent = v.hanzi;
  fcPinyin.textContent = v.pinyin;
  fcDef.innerHTML = `<em class="text-secondary">${v.pos}</em> ${v.def}`;

  if (state.cardFlipped){
    fcPinyin.classList.remove('d-none');
    fcDef.classList.remove('d-none');
    fcHint.textContent = 'Ketuk untuk menyembunyikan';
  } else {
    fcPinyin.classList.add('d-none');
    fcDef.classList.add('d-none');
    fcHint.textContent = 'Ketuk kartu untuk melihat pinyin & arti';
  }
  fcCounter.textContent = `${state.cardIndex + 1} / ${pool.length}  ·  HSK ${v.level}`;
}

function flipCard(){
  state.cardFlipped = !state.cardFlipped;
  renderCard();
}

fcEl.addEventListener('click', flipCard);
document.getElementById('fcFlip').addEventListener('click', e => { e.stopPropagation(); flipCard(); });

document.getElementById('fcNext').addEventListener('click', () => {
  if (!state.cardPool.length) return;
  state.cardIndex = (state.cardIndex + 1) % state.cardPool.length;
  state.cardFlipped = false;
  renderCard();
});

document.getElementById('fcPrev').addEventListener('click', () => {
  if (!state.cardPool.length) return;
  state.cardIndex = (state.cardIndex - 1 + state.cardPool.length) % state.cardPool.length;
  state.cardFlipped = false;
  renderCard();
});

document.getElementById('fcShuffle').addEventListener('click', buildCardPool);

document.getElementById('fcSpeak').addEventListener('click', () => {
  if (!state.cardPool.length) return;
  speak(state.cardPool[state.cardIndex].hanzi);
});

/* ============================================================
   8. QUIZ
   ============================================================ */
const quizQuestionEl = document.getElementById('quizQuestion');
const quizSubEl = document.getElementById('quizSub');
const quizOptionsEl = document.getElementById('quizOptions');
const quizNextBtn = document.getElementById('quizNext');
const scorePill = document.getElementById('scorePill');

document.getElementById('modeH2M').addEventListener('click', e => {
  state.quizMode = 'h2m';
  e.target.classList.add('active');
  document.getElementById('modeM2H').classList.remove('active');
  resetQuiz();
});

document.getElementById('modeM2H').addEventListener('click', e => {
  state.quizMode = 'm2h';
  e.target.classList.add('active');
  document.getElementById('modeH2M').classList.remove('active');
  resetQuiz();
});

document.getElementById('quizReset').addEventListener('click', resetQuiz);
quizNextBtn.addEventListener('click', newQuestion);

function resetQuiz(){
  state.quizScore = 0;
  state.quizTotal = 0;
  updateScore();
  newQuestion();
}

function updateScore(){
  scorePill.textContent = `✅ ${state.quizScore} / ${state.quizTotal}`;
}

function newQuestion(){
  const pool = filtered(state.level);
  quizNextBtn.classList.add('d-none');
  state.quizLocked = false;

  if (pool.length < 4){
    quizQuestionEl.textContent = '—';
    quizSubEl.textContent = '';
    quizOptionsEl.innerHTML = '<p class="text-muted text-center">Kosakata tidak cukup untuk membuat kuis.</p>';
    return;
  }

  const correct = pool[Math.floor(Math.random() * pool.length)];
  const options = [correct];
  let guard = 0;
  while (options.length < 4 && guard < 500){
    guard++;
    const cand = pool[Math.floor(Math.random() * pool.length)];
    if (options.some(o => o.hanzi === cand.hanzi)) continue;
    if (options.some(o => o.def === cand.def)) continue;
    options.push(cand);
  }
  shuffle(options);

  state.quizCurrent = correct;

  if (state.quizMode === 'h2m'){
    quizQuestionEl.textContent = correct.hanzi;
    quizSubEl.textContent = correct.pinyin;
    quizOptionsEl.innerHTML = options.map((o, i) =>
      `<button class="btn btn-outline-secondary quiz-opt" data-i="${i}">${o.def}</button>`
    ).join('');
  } else {
    quizQuestionEl.textContent = correct.def;
    quizQuestionEl.style.fontSize = '1.35rem';
    quizQuestionEl.style.fontWeight = '600';
    quizQuestionEl.style.letterSpacing = '0';
    quizSubEl.textContent = '(' + correct.pos + ')';
    quizOptionsEl.innerHTML = options.map((o, i) =>
      `<button class="btn btn-outline-secondary quiz-opt" data-i="${i}">
         <span style="font-size:1.3rem;font-weight:700">${o.hanzi}</span>
         <span class="py ms-2">${o.pinyin}</span>
       </button>`
    ).join('');
  }
  if (state.quizMode === 'h2m'){
    quizQuestionEl.style.fontSize = '3rem';
    quizQuestionEl.style.fontWeight = '700';
    quizQuestionEl.style.letterSpacing = '.08em';
  }

  quizOptionsEl.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => answer(parseInt(btn.dataset.i, 10), options, correct));
  });
}

function answer(idx, options, correct){
  if (state.quizLocked) return;
  state.quizLocked = true;
  state.quizTotal++;

  const chosen = options[idx];
  const isRight = chosen.hanzi === correct.hanzi;
  if (isRight) state.quizScore++;
  updateScore();

  quizOptionsEl.querySelectorAll('.quiz-opt').forEach((btn, i) => {
    btn.classList.remove('btn-outline-secondary');
    if (options[i].hanzi === correct.hanzi) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
    btn.disabled = true;
  });

  if (!isRight){
    setTimeout(() => {
      const bad = quizOptionsEl.querySelector('.quiz-opt.wrong');
      if (bad) bad.classList.add('wrong');
    }, 50);
  }

  speak(correct.hanzi);
  quizNextBtn.classList.remove('d-none');
}

/* ============================================================
   9. INIT
   ============================================================ */
document.getElementById('totalBadge').textContent = VOCAB.length + ' entri';
updateCount();
renderList();
buildCardPool();
updateScore();
</script>
